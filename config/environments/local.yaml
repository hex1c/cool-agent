schemaVersion: novus.config.v1
kind: environment
environment: local
telegram:
  botUsername: novus_local_bot
  forumChatId: -1001234567890
  botTokenRef: /novus/local/telegram/bot-token
  webhookSecretRef: /novus/local/telegram/webhook-secret
  privacyMode: true
google:
  clientId: local-development-client.apps.googleusercontent.com
  clientSecretRef: /novus/local/google/client-secret
  callbackUri: http://localhost:3000/oauth/google/callback
  scopes:
    - openid
    - email
    - https://www.googleapis.com/auth/drive.file
    - https://www.googleapis.com/auth/calendar.events
email:
  secretRef: /novus/local/smtp/credentials
ai:
  secretRef: /novus/local/ai/provider-key
