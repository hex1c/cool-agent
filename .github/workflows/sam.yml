name: SAM build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17
        with:
          use-installer: true
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.97.0
      - run: cargo install cargo-lambda --locked --version 1.9.1
      - run: sam validate --lint --template-file infrastructure/spikes/rust-lambda.yaml
      - run: sam build --template-file infrastructure/spikes/rust-lambda.yaml
      - name: Prove invalid SAM fixture fails validation
        shell: bash
        run: |
          if sam validate --lint --template-file tests/fixtures/sam/invalid.yaml; then
            echo 'invalid SAM fixture unexpectedly passed validation' >&2
            exit 1
          fi
