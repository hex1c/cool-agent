name: SAM build

on:
  pull_request:
  push:
    branches: [dev, staging, prod]

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.sam }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            sam:
              - 'functions/**'
              - 'infrastructure/**'
              - 'services/agent-harness/**'
              - 'tests/fixtures/sam/**'
              - 'Cargo.lock'
              - 'Makefile'
              - '.samignore'
              - '.github/workflows/sam.yml'

  sam:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17
        with:
          use-installer: true
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.97.0
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.13.0"
      - uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2
        with:
          tool: cargo-lambda@1.9.1
      - run: sam validate --lint --template-file infrastructure/spikes/rust-lambda.yaml
      - run: sam build --template-file infrastructure/spikes/rust-lambda.yaml
      - name: Validate core SAM template (Task 39)
        run: sam validate --lint --template-file infrastructure/template.yaml
      - name: Prove invalid SAM fixture fails validation
        shell: bash
        run: |
          if sam validate --lint --template-file tests/fixtures/sam/invalid.yaml; then
            echo 'invalid SAM fixture unexpectedly passed validation' >&2
            exit 1
          fi
