name: TypeScript agent harness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - run: npm run format:check --workspace services/agent-harness
      - run: npm run lint --workspace services/agent-harness
      - run: npm test --workspace services/agent-harness -- --run
      - run: npm run build --workspace services/agent-harness
