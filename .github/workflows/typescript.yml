name: TypeScript agent harness

on:
  pull_request:
  push:
    branches: [dev, staging, prod]

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - run: npm run format:check --workspace services/agent-harness
      - run: npm run lint --workspace services/agent-harness
      - run: npm test --workspace services/agent-harness -- --run
      - run: npm run build --workspace services/agent-harness
