name: Rust

on:
  pull_request:
  push:
    branches: [dev, staging, prod]

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.rust }}
      coverage_changed: ${{ steps.filter.outputs.rust_source }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'functions/**'
              - 'tests/**'
              - 'infrastructure/local/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/rust.yml'
            rust_source:
              - '**/*.rs'

  rust:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          # Toolchain is pinned to 1.97.0 via rust-toolchain.toml + dtolnay,
          # so do NOT hash the runner's pre-installed system Rust (e.g. 1.97.1)
          # into the key -- GitHub bumps that patch version frequently and every
          # run would otherwise miss the cache. Supply an explicit dependency
          # configuration hash because disabling the automatic environment hash
          # also disables rust-cache's automatic manifest/lockfile hash.
          add-rust-environment-hash-key: false
          key: ${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
      - uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2
        with:
          tool: cargo-nextest@0.9.140
      - run: cargo fmt --all -- --check
      - name: Workspace dependency centralization
        run: python3 scripts/check-workspace-deps.py
      - name: Unused dependency audit (cargo-machete)
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2
        with:
          tool: cargo-machete@0.9.2
      - run: cargo machete --with-metadata --skip-target-dir .
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Start credential-free local sandbox
        run: |
          set -euo pipefail
          compose_file=infrastructure/local/docker-compose.yaml
          docker compose -f "$compose_file" up -d
          init_id=$(docker compose -f "$compose_file" ps --all --quiet sandbox-init)
          test -n "$init_id"
          init_status=$(docker wait "$init_id")
          docker logs "$init_id"
          test "$init_status" = 0
      - run: cargo nextest run --workspace --all-features
      - run: cargo build --workspace --all-features
      - name: Stop local sandbox
        if: always()
        run: docker compose -f infrastructure/local/docker-compose.yaml down -v

  coverage:
    needs: detect
    if: needs.detect.outputs.coverage_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.0
          components: llvm-tools-preview
      # Coverage uses incompatible instrumented artifacts. Keep its cache
      # isolated from target/ and key it only by build configuration.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: ". -> target/llvm-cov-target"
          shared-key: llvm-cov-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          add-rust-environment-hash-key: false
      - uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2
        with:
          tool: cargo-nextest@0.9.140,cargo-llvm-cov@0.8.7
      - name: Start credential-free local sandbox
        run: |
          set -euo pipefail
          compose_file=infrastructure/local/docker-compose.yaml
          docker compose -f "$compose_file" up -d
          init_id=$(docker compose -f "$compose_file" ps --all --quiet sandbox-init)
          test -n "$init_id"
          init_status=$(docker wait "$init_id")
          docker logs "$init_id"
          test "$init_status" = 0
      - name: Collect coverage
        run: cargo llvm-cov --workspace --all-features --lcov --output-path coverage.lcov nextest
      - name: Summarize coverage for changed files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="origin/$BASE_REF"
            git fetch origin "$BASE_REF"
          else
            BASE="HEAD~1"
          fi
          mapfile -t CHANGED < <(git diff --name-only --diff-filter=d "$BASE...HEAD" -- '*.rs')
          if [ "${#CHANGED[@]}" -eq 0 ]; then
            echo 'No changed Rust files; skipping coverage summary.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 .github/scripts/coverage-summary.py coverage.lcov "${CHANGED[@]}" >> "$GITHUB_STEP_SUMMARY"
      - name: Stop local sandbox
        if: always()
        run: docker compose -f infrastructure/local/docker-compose.yaml down -v
