name: Rust

on:
  pull_request:
  push:
    branches: [dev, staging, prod]

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: dorny/paths-filter@6852f92c20ea7fd3b0c25de3b5112db3a98da050 # v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'functions/**'
              - 'tests/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/rust.yml'

  rust:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
      # cargo-llvm-cov builds into a separate target dir (target/llvm-cov-target)
      # with -Cinstrument-coverage + cfg(coverage), so its artifacts are
      # incompatible with the normal target/ cache and cannot be reused.
      # Cache that dir separately so the instrumented full rebuild only happens
      # on the first run or when dependencies change.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: ". -> target/llvm-cov-target"
          shared-key: llvm-cov
      - uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2
        with:
          tool: cargo-nextest@0.9.140,cargo-llvm-cov@0.8.7
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo nextest run --workspace --all-features
      - run: cargo build --workspace --all-features
      - name: Collect coverage
        run: cargo llvm-cov --workspace --all-features --lcov --output-path coverage.lcov nextest
      - name: Summarize coverage for changed files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="origin/$BASE_REF"
            git fetch origin "$BASE_REF"
          else
            BASE="HEAD~1"
          fi
          mapfile -t CHANGED < <(git diff --name-only --diff-filter=d "$BASE...HEAD" -- '*.rs')
          if [ "${#CHANGED[@]}" -eq 0 ]; then
            echo 'No changed Rust files; skipping coverage summary.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 .github/scripts/coverage-summary.py coverage.lcov "${CHANGED[@]}" >> "$GITHUB_STEP_SUMMARY"
