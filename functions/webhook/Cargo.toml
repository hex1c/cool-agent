[package]
name = "webhook-function"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[dependencies]
lambda_runtime = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread"] }
telegram = { path = "../../crates/telegram" }
domain = { path = "../../crates/domain" }

[lints.rust]
unsafe_code = "deny"
warnings = "deny"

[lints.clippy]
all = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
"indexing_slicing" = "deny"
