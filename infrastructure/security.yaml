    Properties:
      LogGroupName: !Sub "/aws/lambda/novus-${EnvironmentName}-cost-guard-external"
      RetentionInDays: !If [IsProduction, 30, 7]
      Tags:
        - { Key: novus:environment, Value: !Ref EnvironmentName }

  CostGuardLogGroup:
