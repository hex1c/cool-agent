AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Novus Telegram Operations Worker — core SAM resources and function packaging
  (Task 39). Packages all Rust and TypeScript Lambda handlers with API Gateway,
  DynamoDB, S3, Parameter Store/KMS, and Step Functions resources. Per-resource
  IAM, encryption defaults, retention, and strict environment-isolation
  controls are layered on by Task 39A.

Parameters:
  EnvironmentName:
    Type: String
    Description: Logical environment name used to isolate physical resources.
    AllowedValues:
      - development
      - staging
      - production
    Default: development
  ConfigSsmParameter:
    Type: String
    Description: >
      SSM Parameter Store path holding the Base64-encoded deployment
      configuration YAML (company + environment overlay merged by the config
      loader, Task 11A). The parameter value is provisioned out-of-band; the
      template only grants read access and never embeds secret material.
    Default: /novus/development/config
  PageTokenSigningKeyParameter:
    Type: String
    Description: SSM SecureString path containing a 32-byte hex pagination signing key.
    Default: /novus/development/storage/page-token-key
  GoogleOAuthClientId:
    Type: String
    Description: Environment-specific Google OAuth Web client ID.
    Default: sanitized-development-client.apps.googleusercontent.com
  GoogleOAuthRedirectUri:
    Type: String
    Description: Exact environment-specific Google OAuth callback URI.
    Default: https://dev.example.test/oauth/google/callback
  GoogleOAuthClientSecretParameter:
    Type: String
    Description: SSM SecureString path containing the Google OAuth client secret.
    Default: /novus/development/google/client-secret
  SmtpCredentialsParameter:
    Type: String
    Description: SSM SecureString path containing JSON SMTP username/password fields.
    Default: /novus/development/smtp/credentials

Conditions:
  IsProduction: !Equals [!Ref EnvironmentName, production]

Globals:
  Function:
    Runtime: provided.al2023
    Architectures:
      - x86_64
    MemorySize: 256
    Timeout: 30
    Tracing: Active
    Environment:
      Variables:
        ENVIRONMENT: !Ref EnvironmentName
        AWS_NODEJS_CONNECTION_REUSE_ENABLED: "1"
        CONFIG_SSM_PARAMETER: !Ref ConfigSsmParameter
        APPLICATION_TABLE: !Ref ApplicationTable
        BUDGET_TABLE: !Ref BudgetTable
        ARTIFACT_BUCKET: !Ref ArtifactBucket

Resources:
  # ---------------------------------------------------------------------------

  SecretsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "Novus ${EnvironmentName} secret encryption key"
      EnableKeyRotation: true
      KeySpec: SYMMETRIC_DEFAULT
      KeyUsage: ENCRYPT_DECRYPT

  SecretsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/novus/${EnvironmentName}/secrets"
      TargetKeyId: !Ref SecretsKey

  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "novus-${EnvironmentName}-artifacts-${AWS::Region}-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpirePresignedLinks
            Prefix: links/
            Status: Enabled
            ExpirationInDays: 7
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - { Key: novus:environment, Value: !Ref EnvironmentName }
        - { Key: novus:component, Value: artifacts }

  ApplicationTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "novus-${EnvironmentName}-application"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      Tags:
        - { Key: novus:environment, Value: !Ref EnvironmentName }
        - { Key: novus:component, Value: application-table }

  BudgetTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "novus-${EnvironmentName}-budget"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      Tags:
        - { Key: novus:environment, Value: !Ref EnvironmentName }
        - { Key: novus:component, Value: budget-table }

  EdgeApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref EnvironmentName
      TracingEnabled: true
      MethodSettings:
        - DataTraceEnabled: false
          HttpMethod: "*"
          ResourcePath: "/*"
          LoggingLevel: INFO

  WorkflowExecutionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/states/novus-${EnvironmentName}-workflows"
      RetentionInDays: !If [IsProduction, 30, 7]
      Tags:
        - { Key: novus:environment, Value: !Ref EnvironmentName }

  # ---------------------------------------------------------------------------
  # IAM and security overlays (Task 39A). Nested stacks keep least-privilege
  # roles and security controls reviewable in their own files.
  # ---------------------------------------------------------------------------

  FunctionsIamStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: policies/functions.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        ApplicationTableArn: !GetAtt ApplicationTable.Arn
        BudgetTableArn: !GetAtt BudgetTable.Arn
        ArtifactBucketArn: !GetAtt ArtifactBucket.Arn
        SecretsKeyArn: !GetAtt SecretsKey.Arn

  SecurityStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: security.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        ArtifactBucketArn: !GetAtt ArtifactBucket.Arn
        ArtifactBucketName: !Ref ArtifactBucket

  # ---------------------------------------------------------------------------
  # Rust Lambda handlers
  # ---------------------------------------------------------------------------

  WebhookFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "novus-${EnvironmentName}-webhook"
      CodeUri: .
      Handler: bootstrap
      Role: !GetAtt FunctionsIamStack.Outputs.WebhookRoleArn
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          PAGE_TOKEN_SIGNING_KEY_PARAMETER: !Ref PageTokenSigningKeyParameter
          QUOTATION_STATE_MACHINE_ARN: !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:novus-${EnvironmentName}-quotation"
          CALENDAR_STATE_MACHINE_ARN: !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:novus-${EnvironmentName}-calendar"
          EMAIL_STATE_MACHINE_ARN: !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:novus-${EnvironmentName}-email"
      Events:
        TelegramWebhook:
          Type: Api
          Properties:
            RestApiId: !Ref EdgeApi
            Method: POST
            Path: /webhook

  OAuthFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "novus-${EnvironmentName}-oauth"
      CodeUri: .
      Handler: bootstrap
      Role: !GetAtt FunctionsIamStack.Outputs.OAuthRoleArn
      MemorySize: 256
      Timeout: 15
      Environment:
        Variables:
          OAUTH_CLIENT_ID: !Ref GoogleOAuthClientId
          OAUTH_REDIRECT_URI: !Ref GoogleOAuthRedirectUri
          OAUTH_CLIENT_SECRET_PARAMETER: !Ref GoogleOAuthClientSecretParameter
      Events:
        Authorize:
          Type: Api
          Properties:
            RestApiId: !Ref EdgeApi
            Method: GET
            Path: /oauth/authorize/{participantId}
        Callback:
          Type: Api
          Properties:
            RestApiId: !Ref EdgeApi
            Method: GET
            Path: /oauth/google/callback

  AttachmentCollectionFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "novus-${EnvironmentName}-attachment-collection"
      CodeUri: .
      Handler: bootstrap
      Role: !GetAtt FunctionsIamStack.Outputs.AttachmentCollectionRoleArn
      MemorySize: 512
      Timeout: 60

  WorkflowActionFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "novus-${EnvironmentName}-workflow-action"
      CodeUri: .
      Handler: bootstrap
      Role: !GetAtt FunctionsIamStack.Outputs.WorkflowActionRoleArn
      MemorySize: 256
      Timeout: 10

  PdfRenderFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "novus-${EnvironmentName}-pdf-render"
      CodeUri: .
      Handler: bootstrap
      Role: !GetAtt FunctionsIamStack.Outputs.PdfRenderRoleArn
      MemorySize: 1024
      Timeout: 60

  DeliveryFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "novus-${EnvironmentName}-delivery"
      CodeUri: .
      Handler: bootstrap
      Role: !GetAtt FunctionsIamStack.Outputs.DeliveryRoleArn
      MemorySize: 1024
      Timeout: 120

  GoogleActionsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "novus-${EnvironmentName}-google-actions"
      CodeUri: .
      Handler: bootstrap
      Role: !GetAtt FunctionsIamStack.Outputs.GoogleActionsRoleArn
      MemorySize: 512
      Timeout: 60

  CalendarActionsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "novus-${EnvironmentName}-calendar-actions"
      CodeUri: .
      Handler: bootstrap
      Role: !GetAtt FunctionsIamStack.Outputs.CalendarActionsRoleArn
      MemorySize: 512
      Timeout: 60

  EmailActionsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "novus-${EnvironmentName}-email-actions"
      CodeUri: .
      Handler: bootstrap
      Role: !GetAtt FunctionsIamStack.Outputs.EmailActionsRoleArn
      MemorySize: 512
      Timeout: 60
      Environment:
        Variables:
          HOSTINGER_SMTP_HOST: smtp.hostinger.com
          HOSTINGER_SMTP_PORT: "587"
          HOSTINGER_SMTP_SECURITY: starttls
          SMTP_CREDENTIALS_PARAMETER: !Ref SmtpCredentialsParameter

  CostGuardIntakeFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "novus-${EnvironmentName}-cost-guard-intake"
      CodeUri: .
      Handler: bootstrap
      Role: !GetAtt FunctionsIamStack.Outputs.CostGuardRoleArn
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          OPERATION_CLASS: new_workflow
          PRICING_VERSION: task41-2026-07-23
          PRICING_APPROVAL_ID: task41-2026-07-23

  CostGuardAiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "novus-${EnvironmentName}-cost-guard-ai"
      CodeUri: .
      Handler: bootstrap
      Role: !GetAtt FunctionsIamStack.Outputs.CostGuardRoleArn
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          OPERATION_CLASS: ai_call
          PRICING_VERSION: task41-2026-07-23
          PRICING_APPROVAL_ID: task41-2026-07-23

  CostGuardExternalFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "novus-${EnvironmentName}-cost-guard-external"
      CodeUri: .
      Handler: bootstrap
      Role: !GetAtt FunctionsIamStack.Outputs.CostGuardRoleArn
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          OPERATION_CLASS: external_write
          PRICING_VERSION: task41-2026-07-23
          PRICING_APPROVAL_ID: task41-2026-07-23

  CostGuardFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "novus-${EnvironmentName}-cost-guard"
      Description: >
        Per-environment budget guard (ADR 0002, Task 41). Derives trusted
        reservations from server-side envelopes, enforces warning/suspension/
        hard-cap thresholds, and emits redacted observability. Environment
        comes from function config, never caller payload.
      CodeUri: .
      Handler: bootstrap
      Role: !GetAtt FunctionsIamStack.Outputs.CostGuardRoleArn
      MemorySize: 256
      Timeout: 10
      Events:
        BudgetHeartbeat:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Enabled: true
            Input: '{"action":"snapshot","schemaVersion":"novus.workflow-actions.v1"}'
      Environment:
        Variables:
          ENVIRONMENT: !Ref EnvironmentName
          APPLICATION_TABLE: !Ref ApplicationTable
          BUDGET_TABLE: !Ref BudgetTable
          ARTIFACT_BUCKET: !Ref ArtifactBucket
          CONFIG_SSM_PARAMETER: !Ref ConfigSsmParameter
          AWS_NODEJS_CONNECTION_REUSE_ENABLED: "1"
          PRICING_VERSION: task41-2026-07-23
          PRICING_APPROVAL_ID: task41-2026-07-23

  # ---------------------------------------------------------------------------
  # TypeScript Pi SDK Lambda handler
  # ---------------------------------------------------------------------------

  AgentHarnessFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub "novus-${EnvironmentName}-agent-harness"
      CodeUri: .
      Runtime: nodejs22.x
      Handler: dist/src/index.handler
      Role: !GetAtt FunctionsIamStack.Outputs.AgentHarnessRoleArn
      MemorySize: 2048
      Timeout: 180

  # ---------------------------------------------------------------------------
  # Step Functions workflows (Task 38). `${LogicalId}` placeholders in the ASL
  # definitions are substituted with the corresponding function ARNs.
  # ---------------------------------------------------------------------------

  QuotationStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "novus-${EnvironmentName}-quotation"
      DefinitionUri: statemachines/quotation.asl.json
      Role: !GetAtt FunctionsIamStack.Outputs.StateMachineExecutionRoleArn
      Logging:
        Level: ALL
        IncludeExecutionData: false
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt WorkflowExecutionLogGroup.Arn
      DefinitionSubstitutions:
        CostGuardFunction: !GetAtt CostGuardFunction.Arn
        CostGuardIntakeFunction: !GetAtt CostGuardIntakeFunction.Arn
        CostGuardAiFunction: !GetAtt CostGuardAiFunction.Arn
        CostGuardExternalFunction: !GetAtt CostGuardExternalFunction.Arn
        WebhookFunction: !GetAtt WebhookFunction.Arn
        AttachmentCollectionFunction: !GetAtt AttachmentCollectionFunction.Arn
        AgentHarnessFunction: !GetAtt AgentHarnessFunction.Arn
        WorkflowActionFunction: !GetAtt WorkflowActionFunction.Arn
        GoogleActionsFunction: !GetAtt GoogleActionsFunction.Arn
        PdfRenderFunction: !GetAtt PdfRenderFunction.Arn
        DeliveryFunction: !GetAtt DeliveryFunction.Arn

  CalendarStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "novus-${EnvironmentName}-calendar"
      DefinitionUri: statemachines/calendar.asl.json
      Role: !GetAtt FunctionsIamStack.Outputs.StateMachineExecutionRoleArn
      Logging:
        Level: ALL
        IncludeExecutionData: false
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt WorkflowExecutionLogGroup.Arn
      DefinitionSubstitutions:
        CostGuardFunction: !GetAtt CostGuardFunction.Arn
        CostGuardIntakeFunction: !GetAtt CostGuardIntakeFunction.Arn
        CostGuardAiFunction: !GetAtt CostGuardAiFunction.Arn
        CostGuardExternalFunction: !GetAtt CostGuardExternalFunction.Arn
        WebhookFunction: !GetAtt WebhookFunction.Arn
        AttachmentCollectionFunction: !GetAtt AttachmentCollectionFunction.Arn
        AgentHarnessFunction: !GetAtt AgentHarnessFunction.Arn
        WorkflowActionFunction: !GetAtt WorkflowActionFunction.Arn
        CalendarActionsFunction: !GetAtt CalendarActionsFunction.Arn

  EmailStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "novus-${EnvironmentName}-email"
      DefinitionUri: statemachines/email.asl.json
      Role: !GetAtt FunctionsIamStack.Outputs.StateMachineExecutionRoleArn
      Logging:
        Level: ALL
        IncludeExecutionData: false
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt WorkflowExecutionLogGroup.Arn
      DefinitionSubstitutions:
        CostGuardFunction: !GetAtt CostGuardFunction.Arn
        CostGuardIntakeFunction: !GetAtt CostGuardIntakeFunction.Arn
        CostGuardAiFunction: !GetAtt CostGuardAiFunction.Arn
        CostGuardExternalFunction: !GetAtt CostGuardExternalFunction.Arn
        WebhookFunction: !GetAtt WebhookFunction.Arn
        AttachmentCollectionFunction: !GetAtt AttachmentCollectionFunction.Arn
        AgentHarnessFunction: !GetAtt AgentHarnessFunction.Arn
        WorkflowActionFunction: !GetAtt WorkflowActionFunction.Arn
        EmailActionsFunction: !GetAtt EmailActionsFunction.Arn

  MonitoringStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: monitoring.yaml
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        QuotationStateMachineArn: !Ref QuotationStateMachine
        CalendarStateMachineArn: !Ref CalendarStateMachine
        EmailStateMachineArn: !Ref EmailStateMachine

Outputs:
  EdgeApiUrl:
    Description: Base URL for the Telegram webhook and OAuth callback API.
    Value: !Sub "https://${EdgeApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}"
  WebhookEndpoint:
    Description: Telegram webhook endpoint.
    Value: !Sub "https://${EdgeApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}/webhook"
  ApplicationTableName:
    Description: DynamoDB application table name.
    Value: !Ref ApplicationTable
  BudgetTableName:
    Description: DynamoDB budget table name.
    Value: !Ref BudgetTable
  ArtifactBucketName:
    Description: S3 artifact bucket name.
    Value: !Ref ArtifactBucket
  CostGuardFunctionArn:
    Description: Environment-bound authoritative budget guard function ARN.
    Value: !GetAtt CostGuardFunction.Arn
  QuotationStateMachineArn:
    Description: Quotation workflow state machine ARN.
    Value: !Ref QuotationStateMachine
  CalendarStateMachineArn:
    Description: Calendar workflow state machine ARN.
    Value: !Ref CalendarStateMachine
  EmailStateMachineArn:
    Description: Email workflow state machine ARN.
    Value: !Ref EmailStateMachine
  SecretsKeyId:
    Description: KMS key id used for secret encryption.
    Value: !Ref SecretsKey
